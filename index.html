<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THALKIRCHENER STUBN</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; background: #f2f0eb; font-family: system-ui, sans-serif;
  }
  main { width: min(92vw, 760px); }
  h1 { text-align: center; font-size: clamp(1.25rem, 3vw, 2rem); margin: 0 0 20px; color: #292929; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(8px, 2vw, 16px); }
  .tile { aspect-ratio: 1 / 1; perspective: 900px; cursor: pointer; outline: none; }
  .tile-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .65s cubic-bezier(.2,.7,.2,1); }
  .tile.flipped .tile-inner { transform: rotateX(180deg); }
  .face {
    position: absolute; inset: 0; overflow: hidden; border-radius: 8px;
    backface-visibility: hidden; background: #ddd; box-shadow: 0 3px 12px #0002;
  }
  .face.back { transform: rotateX(180deg); }
  .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .placeholder {
    display: grid; place-items: center; width: 100%; height: 100%;
    color: #555; font-size: clamp(.7rem, 2vw, 1rem); text-align: center;
    padding: 8px; background: linear-gradient(135deg, #e5e2dc, #c9c5be);
  }
  .hint { text-align: center; color: #666; font-size: .9rem; margin: 16px 0 0; }
</style>
</head>
<body>
<main>
  <h1>THALKIRCHENER STUBN</h1>
  <div class="grid" id="grid" aria-label="Neun Wendekacheln"></div>
  <p class="hint">Klicke oder tippe auf eine Kachel, um sie umzudrehen.</p>
</main>
<script>
const grid = document.getElementById('grid');
for (let i = 1; i <= 9; i++) {
  const tile = document.createElement('div');
  tile.className = 'tile';
  tile.tabIndex = 0;
  tile.setAttribute('role', 'button');
  tile.setAttribute('aria-label', `Kachel ${i} umdrehen`);
  tile.setAttribute('aria-pressed', 'false');
  tile.innerHTML = `
    <div class="tile-inner">
      <div class="face front">
        <img src="bilder/foto${i}-vorne.jpg" alt="Foto ${i}, Vorderseite"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='grid'">
        <div class="placeholder" style="display:none">Foto ${i}<br>Vorderseite</div>
      </div>
      <div class="face back">
        <img src="bilder/foto${i}-hinten.jpg" alt="Foto ${i}, Rückseite"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='grid'">
        <div class="placeholder" style="display:none">Foto ${i}<br>Rückseite</div>
      </div>
    </div>`;
  function flip() {
    tile.classList.toggle('flipped');
    tile.setAttribute('aria-pressed', tile.classList.contains('flipped'));
  }
  tile.addEventListener('click', flip);
  tile.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
  });
  grid.appendChild(tile);
}
</script>
</body>
</html>
